<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101716">
  <title>Mirada — Acceso Seguro por Reconocimiento Facial</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{color-scheme:dark;--bg:#101716;--panel:#171f1d;--line:#283330;--muted:#93a29b;--white:#f1f4ed;--green:#c6f276;--green2:#a8d65b}
    *{box-sizing:border-box} body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 7% 0%,#26302a 0,transparent 34%),var(--bg);color:var(--white);font-family:'DM Sans',sans-serif;display:flex;align-items:center;justify-content:center}
    .login-wrapper{width:100%;max-width:440px;padding:20px}
    .card{background:linear-gradient(145deg,#1a2320,#151d1b);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 15px 35px rgba(0,0,0,0.5)}
    .card-head{height:61px;padding:0 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ffffff0d}
    .card-title{display:flex;align-items:center;gap:9px;font:600 12px Manrope,sans-serif}.icon{color:var(--green);width:16px;height:16px}
    .login-body{padding:24px}
    .eyebrow{font:11px 'DM Mono',monospace;letter-spacing:2px;color:var(--green);text-transform:uppercase;margin-bottom:8px}
    h1{font:600 24px Manrope,sans-serif;letter-spacing:-1px;margin:0 0 8px}
    p{margin:0 0 20px;color:var(--muted);font-size:13px;line-height:1.5}
    .form-group{margin-bottom:14px}
    .form-group label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
    .form-control{width:100%;padding:10px 12px;background:#0b100f;border:1px solid var(--line);border-radius:8px;color:var(--white);font-size:13px;outline:none;transition:border-color .15s}
    .form-control:focus{border-color:var(--green)}
    .camera-area{position:relative;width:100%;aspect-ratio:4/3;background:#0b100f;border-radius:12px;overflow:hidden;border:1px solid var(--line);margin-bottom:20px}
    .camera-area video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
    .btn{display:flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:12px 16px;font-size:12px;font-weight:600;cursor:pointer;width:100%;transition:transform .15s,background .15s}
    .btn:hover{transform:translateY(-1px)}
    .btn-primary{color:#182015;background:var(--green);border-color:var(--green)}
    .btn-primary:hover{background:#d3fa90}
    .message{margin-top:16px;padding:12px;border-radius:8px;font-size:12px;text-align:center;display:none}
    .message.error{background:#ef444415;border:1px solid #ef444440;color:#fca5a5;display:block}
    .message.success{background:#c6f27615;border:1px solid #c6f27640;color:var(--green);display:block}
    .register-link{margin-top:16px;text-align:center;font-size:12px}
    .register-link a{color:var(--green);text-decoration:none}
    .register-link a:hover{text-decoration:underline}
  </style>
</head>
<body>
  <div class="login-wrapper">
    <article class="card">
      <div class="card-head">
        <div class="card-title">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M15 3h4a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2ZM9 13H5a2 2 0 0 0-2 2v4a2 2 0 0 0 2 2h4a2 2 0 0 0 2-2v-4a2 2 0 0 0-2-2Z"/><path d="M15 15h2v2h-2zM15 19h2v2h-2zM19 15h2v2h-2zM19 19h2v2h-2z"/></svg>
          Autenticación
        </div>
      </div>
      <div class="login-body">
        <div class="eyebrow">Acceso restringido</div>
        <h1>Iniciar Sesión</h1>
        <p>Ingresa tus datos y posiciónate frente a la cámara para verificar tu identidad.</p>
        
        <div class="form-group">
          <label for="loginEmail">Correo electrónico</label>
          <input type="email" id="loginEmail" class="form-control" placeholder="tu@correo.com" required>
        </div>

        <div class="form-group">
          <label for="loginPassword">Contraseña</label>
          <input type="password" id="loginPassword" class="form-control" placeholder="••••••••" required>
        </div>

        <div class="camera-area">
          <video id="loginVideo" autoplay muted playsinline></video>
        </div>

        <button class="btn btn-primary" id="btnVerify">Verificar Rostro e Ingresar</button>
        <div class="message" id="loginMessage"></div>

        <div class="register-link">
          ¿No tienes cuenta? <a href="/register">Regístrate aquí</a>
        </div>
      </div>
    </article>
  </div>

  <script>
    const video = document.getElementById('loginVideo');
    const btnVerify = document.getElementById('btnVerify');
    const msgBox = document.getElementById('loginMessage');

    // Encender cámara en la pantalla de login
    navigator.mediaDevices.getUserMedia({ video: true })
      .then(stream => { video.srcObject = stream; })
      .catch(err => {
        msgBox.className = "message error";
        msgBox.innerText = "No se pudo acceder a la cámara. Revisa los permisos.";
      });

    // Enviar correo, contraseña y captura al backend para validar
    btnVerify.addEventListener('click', async () => {
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;

      if (!email || !password) {
        msgBox.className = "message error";
        msgBox.innerText = "Por favor ingresa tu correo y contraseña.";
        return;
      }

      btnVerify.disabled = true;
      btnVerify.innerText = "Verificando...";
      msgBox.className = "message";

      const canvas = document.createElement('canvas');
      canvas.width = video.videoWidth || 640;
      canvas.height = video.videoHeight || 480;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      
      const imageDataURL = canvas.toDataURL('image/jpeg');

      try {
        const response = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: email, password: password, image: imageDataURL })
        });
        const data = await response.json();

        if (data.success) {
          msgBox.className = "message success";
          msgBox.innerText = "¡Acceso concedido! Redirigiendo...";
          setTimeout(() => {
            window.location.href = "/app";
          }, 1000);
        } else {
          msgBox.className = "message error";
          msgBox.innerText = data.message || "Credenciales o rostro no reconocidos.";
          btnVerify.disabled = false;
          btnVerify.innerText = "Verificar Rostro e Ingresar";
        }
      } catch (e) {
        msgBox.className = "message error";
        msgBox.innerText = "Error de conexión con el servidor.";
        btnVerify.disabled = false;
        btnVerify.innerText = "Verificar Rostro e Ingresar";
      }
    });
  </script>
</body>
</html>
